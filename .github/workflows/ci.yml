name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: space_sync_test
          POSTGRES_USER: space_sync
          POSTGRES_PASSWORD: space_sync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U space_sync -d space_sync_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://space_sync:space_sync_test@localhost:5432/space_sync_test?schema=public
      JWT_SECRET: ci-only-secret-with-at-least-thirty-two-characters
      JWT_EXPIRES_IN: 1h
      CAMPUS_TIMEZONE: Asia/Jakarta
      SEED_DEMO_EMAIL: student@example.test
      SEED_DEMO_PASSWORD: SpaceSyncCiDemo123!
      DOCUMENT_STORAGE_DIR: /tmp/space-sync-ci-documents
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run db:generate
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run db:migrate:deploy
      - run: npm run db:seed
      - name: Run live API smoke test
        run: |
          set -euo pipefail
          npm run start:prod > /tmp/space-sync-api.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/api/v1/health > /dev/null; then
              npm run test:smoke
              node scripts/smoke-admin.mjs
              node scripts/smoke-push-registration.mjs
              exit 0
            fi
            if [[ "${attempt}" -lt 30 ]]; then sleep 1; fi
          done
          cat /tmp/space-sync-api.log
          exit 1

  mobile:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx expo export --platform android
        env:
          EXPO_PUBLIC_API_URL: https://example.invalid/api/v1

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && vars.AUTO_DEPLOY_VPS == 'true'
    needs: [server, mobile]
    uses: ./.github/workflows/deploy-vps.yml
    with:
      target_sha: ${{ github.sha }}
    secrets: inherit
