name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: campus_space_test
          POSTGRES_USER: campus_space
          POSTGRES_PASSWORD: campus_space_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campus_space -d campus_space_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://campus_space:campus_space_test@localhost:5432/campus_space_test?schema=public
      JWT_SECRET: ci-only-secret-with-at-least-thirty-two-characters
      JWT_EXPIRES_IN: 1h
      CAMPUS_TIMEZONE: Asia/Jakarta
      SEED_DEMO_EMAIL: student@example.test
      SEED_DEMO_PASSWORD: CampusSpaceCiDemo123!
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run db:migrate:deploy
      - run: npm run db:seed
      - name: Run live API smoke test
        run: |
          set -euo pipefail
          npm run start:prod > /tmp/campus-space-api.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/api/v1/health > /dev/null; then
              npm run test:smoke
              exit 0
            fi
            sleep 1
          done
          cat /tmp/campus-space-api.log
          exit 1

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx expo export --platform android
        env:
          EXPO_PUBLIC_API_URL: https://example.invalid/api/v1
