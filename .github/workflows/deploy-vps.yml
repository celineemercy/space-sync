name: Deploy VPS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: campus-space-vps-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment:
      name: vps-production
      url: https://${{ vars.VPS_API_DOMAIN }}/api/v1/health
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      VPS_API_DOMAIN: ${{ vars.VPS_API_DOMAIN }}
    steps:
      - name: Validate deployment secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in VPS_HOST VPS_USER VPS_APP_PATH VPS_SSH_PRIVATE_KEY VPS_KNOWN_HOSTS VPS_API_DOMAIN; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required vps-production secret or variable: ${name}" >&2
              exit 1
            fi
          done

      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 0700 -d ~/.ssh
          printf '%s\n' "${VPS_SSH_PRIVATE_KEY}" > ~/.ssh/campus_space_deploy
          chmod 0600 ~/.ssh/campus_space_deploy
          printf '%s\n' "${VPS_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 0644 ~/.ssh/known_hosts

      - name: Deploy current dev branch
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -i ~/.ssh/campus_space_deploy \
            -o BatchMode=yes \
            "${VPS_USER}@${VPS_HOST}" \
            bash -s -- "${VPS_APP_PATH}" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          app_path="$1"
          cd "${app_path}"
          if [[ -n "$(git status --porcelain)" ]]; then
            echo 'Refusing to deploy over a dirty VPS working tree.' >&2
            exit 1
          fi
          git fetch origin dev
          git switch dev
          git pull --ff-only origin dev
          ./deploy/scripts/deploy.sh
          REMOTE_SCRIPT

      - name: Confirm public health endpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 3 \
            "https://${VPS_API_DOMAIN}/api/v1/health"
