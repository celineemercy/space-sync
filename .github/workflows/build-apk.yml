name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: space-sync-android-preview
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: android-preview
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Check Expo access token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [[ -z "${EXPO_TOKEN}" ]]; then
            echo 'Add EXPO_TOKEN to the android-preview GitHub environment.' >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --runInBand
      - name: Check Android bundle
        run: npx expo export --platform android
        env:
          EXPO_PUBLIC_API_URL: https://example.invalid/api/v1
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build signed preview APK
        run: eas build --platform android --profile apk --non-interactive
