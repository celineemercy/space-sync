name: campus-space

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campus_space}
      POSTGRES_USER: ${POSTGRES_USER:-campus_space}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - campus_space_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus_space -d campus_space"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    profiles: ["full"]
    build:
      context: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-campus_space}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-campus_space}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      JWT_EXPIRES_IN: 1h
      CAMPUS_TIMEZONE: Asia/Jakarta
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8081}
      SEED_DEMO_EMAIL: ${SEED_DEMO_EMAIL:-student@example.test}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:?Set SEED_DEMO_PASSWORD in the root .env file}
    ports:
      - "${SERVER_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  campus_space_postgres:
